<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x8003;&#x8BD5;&#x6210;&#x7EE9;&#x5206;&#x6790;&#x7CFB;&#x7EDF;</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 28px 0; text-align: center; }
        .header h1 { font-size: 28px; letter-spacing: 2px; }
        .header p { margin-top: 8px; opacity: .85; font-size: 14px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

        /* &#x5F55;&#x5165;&#x533A;&#x57DF; */
        .input-section { background: #fff; border-radius: 12px; padding: 24px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 24px; }
        .input-section h2 { font-size: 18px; margin-bottom: 16px; color: #444; border-left: 4px solid #667eea; padding-left: 10px; }
        .exam-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 0; border-bottom: 1px dashed #e8e8e8; }
        .exam-row:last-child { border-bottom: none; }
        .exam-name { font-weight: 600; min-width: 130px; color: #555; font-size: 15px; }
        .subject-input { display: flex; align-items: center; gap: 4px; }
        .subject-input label { font-size: 13px; color: #666; white-space: nowrap; }
        .subject-input input { width: 64px; padding: 6px 8px; border: 1px solid #d9d9d9; border-radius: 6px; text-align: center; font-size: 14px; transition: border .2s; }
        .subject-input input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 2px rgba(102,126,234,.15); }

        .btn-row { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; }
        .btn { padding: 10px 28px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: all .2s; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(102,126,234,.35); }
        .btn-success { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #fff; }
        .btn-success:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(67,233,123,.35); }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-danger:hover { background: #ff7875; }
        .btn-outline { background: #fff; color: #667eea; border: 1px solid #667eea; }
        .btn-outline:hover { background: #f5f0ff; }

        /* &#x52A8;&#x6001;&#x6DFB;&#x52A0;&#x8003;&#x8BD5; */
        .add-exam-area { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .add-exam-area input { padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; }
        .add-exam-area input:focus { border-color: #667eea; outline: none; }

        /* &#x56FE;&#x8868;&#x533A;&#x57DF; */
        .chart-section { background: #fff; border-radius: 12px; padding: 24px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 24px; }
        .chart-section h2 { font-size: 18px; margin-bottom: 16px; color: #444; border-left: 4px solid #43e97b; padding-left: 10px; }
        .chart-container { position: relative; height: 420px; }

        /* &#x8D8B;&#x52BF;&#x5206;&#x6790; */
        .analysis-section { background: #fff; border-radius: 12px; padding: 24px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 24px; }
        .analysis-section h2 { font-size: 18px; margin-bottom: 16px; color: #444; border-left: 4px solid #faad14; padding-left: 10px; }
        .analysis-card { display: flex; flex-wrap: wrap; gap: 14px; }
        .analysis-item { flex: 1; min-width: 220px; background: #fafafa; border-radius: 10px; padding: 16px; border: 1px solid #f0f0f0; }
        .analysis-item .subject-title { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
        .analysis-item .trend-up { color: #52c41a; }
        .analysis-item .trend-down { color: #ff4d4f; }
        .analysis-item .trend-flat { color: #faad14; }
        .analysis-item p { font-size: 13px; line-height: 1.8; color: #555; }
        .analysis-item .arrow { font-size: 18px; margin-right: 4px; }

        /* API Key &#x914D;&#x7F6E; */
        .api-config { background: #fff; border-radius: 12px; padding: 16px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .api-config label { font-size: 14px; font-weight: 600; color: #555; white-space: nowrap; }
        .api-config input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; font-family: monospace; }
        .api-config input:focus { border-color: #667eea; outline: none; }
        .api-config .status { font-size: 13px; padding: 4px 10px; border-radius: 4px; }
        .api-config .status.ok { color: #52c41a; background: #f6ffed; }
        .api-config .status.err { color: #ff4d4f; background: #fff2f0; }

        /* AI &#x8BC4;&#x4EF7;&#x533A;&#x57DF; */
        .ai-section { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); border-radius: 12px; padding: 24px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 24px; }
        .ai-section h2 { font-size: 18px; margin-bottom: 16px; color: #444; border-left: 4px solid #eb2f96; padding-left: 10px; }
        .ai-content { background: #fff; border-radius: 10px; padding: 20px; font-size: 14px; line-height: 1.9; color: #333; white-space: pre-wrap; min-height: 80px; }
        .ai-content.loading { color: #999; font-style: italic; }
        .ai-content .error { color: #ff4d4f; }
        .btn-ai { background: linear-gradient(135deg, #eb2f96, #722ed1); color: #fff; }
        .btn-ai:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(235,47,150,.35); }
        .btn-ai:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

        /* &#x9519;&#x9898;&#x533A;&#x57DF; */
        .wrong-q-toggle { background: none; border: 1px dashed #d9d9d9; color: #888; padding: 5px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all .2s; position: relative; }
        .wrong-q-toggle:hover { border-color: #667eea; color: #667eea; }
        .wrong-q-toggle.active { border-color: #faad14; color: #faad14; background: #fffbe6; }
        .wrong-q-toggle .badge { display: inline-block; background: #ff4d4f; color: #fff; font-size: 11px; border-radius: 50%; width: 18px; height: 18px; line-height: 18px; text-align: center; margin-left: 4px; vertical-align: middle; }
        .wrong-q-panel { display: none; width: 100%; margin-top: 10px; padding: 14px; background: #fafafa; border-radius: 8px; border: 1px solid #f0f0f0; }
        .wrong-q-panel.open { display: block; }
        .wrong-q-panel h4 { font-size: 13px; color: #888; margin-bottom: 12px; }
        .wrong-q-subject { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #f0f0f0; }
        .wrong-q-subject:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .wrong-q-subject label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
        .wrong-q-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; min-height: 20px; }
        .wrong-q-img-wrap { position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden; border: 1px solid #e8e8e8; }
        .wrong-q-img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform .2s; }
        .wrong-q-img-wrap img:hover { transform: scale(1.05); }
        .wrong-q-img-wrap .del-img { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(255,77,79,.85); color: #fff; border: none; border-radius: 50%; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; padding: 0; }
        .wrong-q-img-wrap .del-img:hover { background: #ff4d4f; }
        .upload-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border: 1px dashed #bfbfbf; border-radius: 6px; background: #fff; color: #888; font-size: 13px; cursor: pointer; transition: all .2s; }
        .upload-btn:hover { border-color: #667eea; color: #667eea; }
        .exam-block { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed #e8e8e8; }
        .exam-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .exam-block-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .exam-block-header .exam-name { margin: 0; }

        /* &#x56FE;&#x7247;&#x9884;&#x89C8;&#x5927;&#x56FE; */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.8); z-index: 9999; justify-content: center; align-items: center; cursor: pointer; }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 4px 30px rgba(0,0,0,.5); }

        .empty-tip { text-align: center; color: #999; padding: 40px 0; font-size: 15px; }

        @media (max-width: 600px) {
            .exam-name { min-width: 100%; }
            .chart-container { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>&#x1F4CA; &#x8003;&#x8BD5;&#x6210;&#x7EE9;&#x5206;&#x6790;&#x7CFB;&#x7EDF;</h1>
        <p>&#x6279;&#x91CF;&#x5F55;&#x5165;&#x5404;&#x79D1;&#x6210;&#x7EE9;&#xFF0C;&#x751F;&#x6210;&#x8D8B;&#x52BF;&#x56FE;&#x8868;&#xFF0C;&#x5206;&#x6790;&#x53D1;&#x5C55;&#x8D70;&#x5411;</p>
    </div>

    <div class="container">
        <!-- API Key &#x914D;&#x7F6E; -->
        <div class="api-config">
            <label>&#x1F511; API Key&#xFF1A;</label>
            <input id="apiKey" type="hidden" value="server">
            <span id="apiStatus" class="status">&#x5DF2;&#x914D;&#x7F6E;</span>
        </div>

        <!-- &#x6210;&#x7EE9;&#x5F55;&#x5165; -->
        <div class="input-section">
            <h2>&#x6210;&#x7EE9;&#x5F55;&#x5165;</h2>
            <div id="examList"></div>

            <div class="add-exam-area">
                <input id="newExamName" type="text" placeholder="&#x8003;&#x8BD5;&#x540D;&#x79F0;&#xFF08;&#x5982;&#xFF1A;&#x671F;&#x672B;&#x8003;&#x8BD5;&#xFF09;" style="width:180px">
                <input id="newSubjectCount" type="number" placeholder="&#x79D1;&#x76EE;&#x6570;" min="1" max="15" style="width:90px">
                <button class="btn btn-outline" onclick="addExam()">&#xFF0B; &#x6DFB;&#x52A0;&#x8003;&#x8BD5;</button>
            </div>

            <div class="btn-row">
                <button class="btn btn-success" onclick="generateChart()">&#x1F4C8; &#x751F;&#x6210;&#x56FE;&#x8868;&#x4E0E;&#x5206;&#x6790;</button>
                <button class="btn btn-ai" id="btnAI" onclick="callAI()" disabled>&#x1F916; AI &#x9510;&#x8BC4;</button>
                <button class="btn btn-primary" onclick="saveData()" id="btnSave">&#x1F4BE; &#x4FDD;&#x5B58;&#x6570;&#x636E;</button>
                <button class="btn btn-danger" onclick="clearAll()">&#x1F5D1; &#x6E05;&#x7A7A;&#x5168;&#x90E8;</button>
                <span id="saveStatus" style="font-size:13px;color:#999;align-self:center;"></span>
            </div>
        </div>

        <!-- &#x6298;&#x7EBF;&#x56FE; -->
        <div class="chart-section" id="chartSection" style="display:none">
            <h2>&#x6210;&#x7EE9;&#x8D8B;&#x52BF;&#x56FE;</h2>
            <div class="chart-container">
                <canvas id="scoreChart"></canvas>
            </div>
        </div>

        <!-- &#x8D8B;&#x52BF;&#x5206;&#x6790; -->
        <div class="analysis-section" id="analysisSection" style="display:none">
            <h2>&#x53D1;&#x5C55;&#x8D8B;&#x52BF;&#x5206;&#x6790;</h2>
            <div class="analysis-card" id="analysisCard"></div>
        </div>

        <!-- AI &#x667A;&#x80FD;&#x8BC4;&#x4EF7; -->
        <div class="ai-section" id="aiSection" style="display:none">
            <h2>&#x1F916; AI &#x9510;&#x8BC4;</h2>
            <div class="ai-content" id="aiContent"></div>
        </div>
    </div>

    <!-- &#x56FE;&#x7247;&#x5927;&#x56FE;&#x9884;&#x89C8; -->
    <div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
        <img id="lightboxImg" src="" alt="&#x9884;&#x89C8;">
    </div>

<script>
// \u989C\u8272\u65B9\u6848
const COLORS = [
    '#667eea','#f5222d','#52c41a','#faad14','#13c2c2',
    '#eb2f96','#722ed1','#fa8c16','#2f54eb','#a0d911',
    '#fa541c','#1890ff','#9254de','#fadb14','#36cfc9'
];

let examData = []; // [{name, subjects:[{label, score, wrongImages:[]}], }]
let chartInstance = null;
const LOCAL_DATA_KEY = 'score-analyzer-exam-data';
const DEFAULT_SUBJECTS = ['\u8BED\u6587', '\u6570\u5B66', '\u82F1\u8BED', '\u7269\u7406', '\u5316\u5B66', '\u5386\u53F2', '\u9053\u6CD5'];

// \u521D\u59CB\u5316\uFF1A\u6DFB\u52A0\u4E24\u573A\u9ED8\u8BA4\u8003\u8BD5
function init() {
    addExamRow('\u7B2C\u4E00\u6B21\u6708\u8003', DEFAULT_SUBJECTS, ['', '', '', '', '', '', '']);
    addExamRow('\u671F\u4E2D\u8003\u8BD5', DEFAULT_SUBJECTS, ['', '', '', '', '', '', '']);
}

function ensureDefaultSubjects(data) {
    return data.map(exam => {
        const existing = Array.isArray(exam.subjects) ? exam.subjects : [];
        const byLabel = new Map(existing.map(sub => [sub.label, sub]));
        const subjects = DEFAULT_SUBJECTS.map(label => byLabel.get(label) || ({ label, score: '', wrongImages: [] }));
        existing.forEach(sub => {
            if (!DEFAULT_SUBJECTS.includes(sub.label)) subjects.push(sub);
        });
        return { name: exam.name, subjects };
    });
}

function addExamRow(name, subjects, scores) {
    const idx = examData.length;
    examData.push({
        name,
        subjects: subjects.map((s,i) => ({ label: s, score: scores[i] || '', wrongImages: [] }))
    });
    renderExamList();
    saveLocalData();
}

function renderExamList() {
    const container = document.getElementById('examList');
    container.innerHTML = '';
    examData.forEach((exam, ei) => {
        const block = document.createElement('div');
        block.className = 'exam-block';

        // \u8003\u8BD5\u5934\u90E8
        const header = document.createElement('div');
        header.className = 'exam-block-header';
        const nameDiv = document.createElement('span');
        nameDiv.className = 'exam-name';
        nameDiv.textContent = exam.name;
        header.appendChild(nameDiv);

        // \u5404\u79D1\u6210\u7EE9\u8F93\u5165
        const scoresDiv = document.createElement('div');
        scoresDiv.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1;';
        exam.subjects.forEach((sub, si) => {
            const div = document.createElement('div');
            div.className = 'subject-input';
            div.innerHTML = `<label>${sub.label}</label><input type="number" min="0" max="150" placeholder="\u2014" value="${sub.score}">`;
            div.querySelector('input').addEventListener('input', function() {
                examData[ei].subjects[si].score = this.value;
                saveLocalData();
            });
            scoresDiv.appendChild(div);
        });
        header.appendChild(scoresDiv);

        // \u9519\u9898\u5C55\u5F00\u6309\u94AE\uFF08\u5E26\u6570\u91CF\u5FBD\u6807\uFF09
        const wqBtn = document.createElement('button');
        wqBtn.className = 'wrong-q-toggle';
        const totalImgs = exam.subjects.reduce((sum, s) => sum + s.wrongImages.length, 0);
        wqBtn.innerHTML = '\u{1F4DD} \u9519\u9898' + (totalImgs > 0 ? `<span class="badge">${totalImgs}</span>` : '');
        wqBtn.onclick = () => {
            const panel = block.querySelector('.wrong-q-panel');
            const isOpen = panel.classList.contains('open');
            panel.classList.toggle('open');
            wqBtn.classList.toggle('active');
        };
        header.appendChild(wqBtn);

        // \u5220\u9664\u6309\u94AE
        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-danger';
        delBtn.style.cssText = 'padding:6px 14px;font-size:13px;';
        delBtn.textContent = '\u5220\u9664';
        delBtn.onclick = () => { examData.splice(ei, 1); renderExamList(); saveLocalData(); };
        header.appendChild(delBtn);

        block.appendChild(header);

        // \u9519\u9898\u56FE\u7247\u5F55\u5165\u9762\u677F
        const panel = document.createElement('div');
        panel.className = 'wrong-q-panel';
        panel.innerHTML = '<h4>\u{1F4F7} \u62CD\u7167\u6216\u4E0A\u4F20\u5404\u79D1\u9519\u9898\u56FE\u7247\uFF08\u6BCF\u79D1\u53EF\u591A\u5F20\uFF09</h4>';
        exam.subjects.forEach((sub, si) => {
            const sDiv = document.createElement('div');
            sDiv.className = 'wrong-q-subject';

            const label = document.createElement('label');
            label.textContent = sub.label;
            sDiv.appendChild(label);

            // \u5DF2\u4E0A\u4F20\u56FE\u7247\u7F29\u7565\u56FE
            const imgsDiv = document.createElement('div');
            imgsDiv.className = 'wrong-q-imgs';
            sub.wrongImages.forEach((dataUrl, imgIdx) => {
                const wrap = document.createElement('div');
                wrap.className = 'wrong-q-img-wrap';
                wrap.innerHTML = `<img src="${dataUrl}" onclick="showLightbox(this.src)"><button class="del-img" title="\u5220\u9664">\u00D7</button>`;
                wrap.querySelector('.del-img').onclick = () => {
                    examData[ei].subjects[si].wrongImages.splice(imgIdx, 1);
                    renderExamList();
                    saveLocalData();
                };
                imgsDiv.appendChild(wrap);
            });
            sDiv.appendChild(imgsDiv);

            // \u4E0A\u4F20\u6309\u94AE
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.multiple = true;
            fileInput.style.display = 'none';
            fileInput.onchange = function() {
                const files = Array.from(this.files);
                let loaded = 0;
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        // \u538B\u7F29\u56FE\u7247
                        compressImage(e.target.result, 800, 0.7, (compressed) => {
                            examData[ei].subjects[si].wrongImages.push(compressed);
                            loaded++;
                            if (loaded === files.length) {
                                renderExamList();
                                saveLocalData();
                            }
                        });
                    };
                    reader.readAsDataURL(file);
                });
                this.value = '';
            };
            sDiv.appendChild(fileInput);

            const uploadBtn = document.createElement('button');
            uploadBtn.className = 'upload-btn';
            uploadBtn.innerHTML = '\u{1F4F7} \u62CD\u7167/\u4E0A\u4F20';
            uploadBtn.onclick = () => fileInput.click();
            sDiv.appendChild(uploadBtn);

            panel.appendChild(sDiv);
        });
        block.appendChild(panel);

        container.appendChild(block);
    });
}

// \u56FE\u7247\u538B\u7F29
function compressImage(dataUrl, maxWidth, quality, callback) {
    const img = new Image();
    img.onload = function() {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
}

// \u5927\u56FE\u9884\u89C8
function showLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('show');
}

function addExam() {
    const nameInput = document.getElementById('newExamName');
    const countInput = document.getElementById('newSubjectCount');
    const name = nameInput.value.trim();
    const count = parseInt(countInput.value);
    if (!name) { alert('\u8BF7\u8F93\u5165\u8003\u8BD5\u540D\u79F0'); return; }
    if (!count || count < 1) { alert('\u8BF7\u8F93\u5165\u6709\u6548\u7684\u79D1\u76EE\u6570\u91CF'); return; }

    // \u53D6\u7B2C\u4E00\u573A\u8003\u8BD5\u7684\u79D1\u76EE\u540D\u4F5C\u4E3A\u53C2\u8003
    const refSubjects = examData.length > 0 ? examData[0].subjects.map(s => s.label) : DEFAULT_SUBJECTS;
    const subjects = [];
    for (let i = 0; i < count; i++) {
        subjects.push(refSubjects[i] || `\u79D1\u76EE${i + 1}`);
    }
    const scores = new Array(count).fill('');
    addExamRow(name, subjects, scores);
    nameInput.value = '';
    countInput.value = '';
}

function clearAll() {
    if (!confirm('\u786E\u5B9A\u6E05\u7A7A\u6240\u6709\u6570\u636E\uFF1F\uFF08\u5305\u62EC\u670D\u52A1\u5668\u6570\u636E\uFF09')) return;
    examData = [];
    renderExamList();
    document.getElementById('chartSection').style.display = 'none';
    document.getElementById('analysisSection').style.display = 'none';
    document.getElementById('aiSection').style.display = 'none';
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    localStorage.removeItem(LOCAL_DATA_KEY);
    init();
    // \u6E05\u7A7A\u670D\u52A1\u5668\u6570\u636E
    fetch('/api/exams', { method: 'DELETE' }).catch(() => {});
}

function generateChart() {
    if (examData.length < 2) { alert('\u81F3\u5C11\u9700\u8981\u4E24\u573A\u8003\u8BD5\u6570\u636E\u624D\u80FD\u751F\u6210\u8D8B\u52BF\u56FE'); return; }

    // \u6536\u96C6\u6570\u636E
    const labels = examData.map(e => e.name);
    const subjectCount = examData[0].subjects.length;

    // \u6821\u9A8C\u79D1\u76EE\u4E00\u81F4\u6027
    for (let i = 1; i < examData.length; i++) {
        if (examData[i].subjects.length !== subjectCount) {
            alert('\u5404\u8003\u8BD5\u7684\u79D1\u76EE\u6570\u91CF\u4E0D\u4E00\u81F4\uFF0C\u65E0\u6CD5\u751F\u6210\u5BF9\u6BD4\u56FE\u8868\uFF0C\u8BF7\u68C0\u67E5\u6570\u636E\u3002');
            return;
        }
    }

    // \u6784\u5EFA\u6570\u636E\u96C6
    const datasets = [];
    const validData = []; // \u7528\u4E8E\u8D8B\u52BF\u5206\u6790
    for (let si = 0; si < subjectCount; si++) {
        const subjectName = examData[0].subjects[si].label;
        const data = [];
        let hasData = false;
        examData.forEach((exam, ei) => {
            const val = exam.subjects[si].score;
            if (val !== '' && val !== undefined) {
                data.push(parseFloat(val));
                hasData = true;
            } else {
                data.push(null);
            }
        });
        if (hasData) {
            datasets.push({
                label: subjectName,
                data: data,
                borderColor: COLORS[si % COLORS.length],
                backgroundColor: COLORS[si % COLORS.length] + '22',
                borderWidth: 2.5,
                pointRadius: 5,
                pointHoverRadius: 7,
                tension: 0.3,
                spanGaps: true,
                fill: false
            });
            validData.push({ name: subjectName, scores: data, color: COLORS[si % COLORS.length] });
        }
    }

    if (datasets.length === 0) { alert('\u6CA1\u6709\u6709\u6548\u7684\u6210\u7EE9\u6570\u636E\uFF0C\u8BF7\u5148\u5F55\u5165\u6210\u7EE9\u3002'); return; }

    // \u6E32\u67D3\u56FE\u8868
    document.getElementById('chartSection').style.display = 'block';
    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('scoreChart').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top', labels: { font: { size: 13 }, usePointStyle: true, padding: 18 } },
                tooltip: {
                    callbacks: {
                        label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} \u5206`
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: false,
                    suggestedMin: 0,
                    suggestedMax: 100,
                    title: { display: true, text: '\u5206\u6570', font: { size: 13 } },
                    grid: { color: '#f0f0f0' }
                },
                x: {
                    title: { display: true, text: '\u8003\u8BD5', font: { size: 13 } },
                    grid: { color: '#f5f5f5' }
                }
            },
            interaction: { mode: 'index', intersect: false }
        }
    });

    // \u751F\u6210\u8D8B\u52BF\u5206\u6790
    window._lastValidData = validData;
    window._lastExamLabels = labels;
    generateAnalysis(validData, labels);
}

function generateAnalysis(validData, examLabels) {
    document.getElementById('analysisSection').style.display = 'block';
    const card = document.getElementById('analysisCard');
    card.innerHTML = '';

    validData.forEach(sub => {
        const scores = sub.scores.filter(v => v !== null);
        if (scores.length < 2) {
            card.innerHTML += `<div class="analysis-item">
                <div class="subject-title" style="color:${sub.color}">${sub.name}</div>
                <p class="trend-flat">\u6570\u636E\u4E0D\u8DB3\uFF0C\u65E0\u6CD5\u5206\u6790\u8D8B\u52BF\u3002</p>
            </div>`;
            return;
        }

        const first = scores[0], last = scores[scores.length - 1];
        const diff = last - first;
        const max = Math.max(...scores), min = Math.min(...scores);
        const avg = (scores.reduce((a,b) => a+b, 0) / scores.length).toFixed(1);

        // \u8D8B\u52BF\u5224\u65AD
        let trend, trendClass, arrow, desc;
        if (Math.abs(diff) < 2) {
            trend = '\u57FA\u672C\u7A33\u5B9A'; trendClass = 'trend-flat'; arrow = '\u27A1\uFE0F';
            desc = `${sub.name}\u6210\u7EE9\u5728 ${min}~${max} \u5206\u4E4B\u95F4\u6CE2\u52A8\uFF0C\u6574\u4F53\u4FDD\u6301\u7A33\u5B9A\uFF0C\u5EFA\u8BAE\u7EE7\u7EED\u4FDD\u6301\u5F53\u524D\u5B66\u4E60\u8282\u594F\u3002`;
        } else if (diff > 0) {
            trend = '\u4E0A\u5347\u8D8B\u52BF'; trendClass = 'trend-up'; arrow = '\u{1F4C8}';
            desc = `${sub.name}\u6210\u7EE9\u5448\u4E0A\u5347\u8D8B\u52BF\uFF0C\u4ECE ${first} \u5206\u5347\u81F3 ${last} \u5206\uFF0C\u63D0\u9AD8\u4E86 ${diff} \u5206\u3002\u7EE7\u7EED\u4FDD\u6301\uFF01`;
        } else {
            trend = '\u4E0B\u964D\u8D8B\u52BF'; trendClass = 'trend-down'; arrow = '\u{1F4C9}';
            desc = `${sub.name}\u6210\u7EE9\u5448\u4E0B\u964D\u8D8B\u52BF\uFF0C\u4ECE ${first} \u5206\u964D\u81F3 ${last} \u5206\uFF0C\u4E0B\u964D\u4E86 ${Math.abs(diff)} \u5206\uFF0C\u5EFA\u8BAE\u52A0\u5F3A\u8BE5\u79D1\u76EE\u7684\u590D\u4E60\u3002`;
        }

        card.innerHTML += `<div class="analysis-item">
            <div class="subject-title" style="color:${sub.color}">${arrow} ${sub.name}\uFF1A${trend}</div>
            <p class="${trendClass}">\u6700\u65B0\u6210\u7EE9\uFF1A<strong>${last}</strong> \u5206 | \u6700\u9AD8\uFF1A<strong>${max}</strong> \u5206 | \u6700\u4F4E\uFF1A<strong>${min}</strong> \u5206 | \u5E73\u5747\uFF1A<strong>${avg}</strong> \u5206</p>
            <p>${desc}</p>
        </div>`;
    });
}

init();

// \u4FDD\u5B58\u6700\u65B0\u4E00\u6B21\u751F\u6210\u7684\u6570\u636E\uFF0C\u4F9B AI \u8BC4\u4EF7\u4F7F\u7528
let lastValidData = null;
let lastExamLabels = null;

// \u5728 generateChart \u672B\u5C3E\u542F\u7528 AI \u6309\u94AE
const origGenerate = generateChart;
generateChart = function() {
    origGenerate();
    lastValidData = window._lastValidData || null;
    lastExamLabels = window._lastExamLabels || null;
    const btn = document.getElementById('btnAI');
    if (lastValidData && lastExamLabels) {
        btn.disabled = false;
    }
};

// \u8C03\u7528\u901A\u4E49\u5343\u95EE AI \u8BC4\u4EF7
async function callAI() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
        alert('\u8BF7\u5148\u914D\u7F6E API Key');
        return;
    }
    if (!lastValidData || !lastExamLabels) {
        alert('\u8BF7\u5148\u751F\u6210\u56FE\u8868');
        return;
    }

    const btn = document.getElementById('btnAI');
    const section = document.getElementById('aiSection');
    const content = document.getElementById('aiContent');

    section.style.display = 'block';
    content.className = 'ai-content loading';
    content.textContent = '\u{1F914} AI \u6B63\u5728\u5206\u6790\u6210\u7EE9\u6570\u636E\uFF0C\u8BF7\u7A0D\u5019...';
    btn.disabled = true;
    btn.textContent = '\u23F3 \u5206\u6790\u4E2D...';

    // \u6784\u5EFA prompt
    let prompt = '\u4EE5\u4E0B\u662F\u5B66\u751F\u591A\u6B21\u8003\u8BD5\u7684\u6210\u7EE9\u548C\u9519\u9898\u6570\u636E\uFF0C\u8BF7\u8FDB\u884C\u201C\u9510\u8BC4\u201D\u5F0F\u5206\u6790\u3002\n\n';
    prompt += '\u8003\u8BD5\uFF1A' + lastExamLabels.join(' \u2192 ') + '\n\n';
    prompt += '\u5404\u79D1\u6210\u7EE9\uFF1A\n';
    lastValidData.forEach(sub => {
        const scores = sub.scores.filter(v => v !== null);
        prompt += `- ${sub.name}\uFF1A${scores.join(' \u2192 ')}\n`;
    });

    // \u6536\u96C6\u9519\u9898\u56FE\u7247\u6570\u636E
    let hasWrongQ = false;
    let wrongQText = '\n\u9519\u9898\u56FE\u7247\u8BB0\u5F55\uFF1A\n';
    examData.forEach(exam => {
        let examWrong = '';
        exam.subjects.forEach(sub => {
            if (sub.wrongImages && sub.wrongImages.length > 0) {
                examWrong += `  - ${sub.name}\uFF1A${sub.wrongImages.length} \u5F20\u9519\u9898\u56FE\u7247\n`;
            }
        });
        if (examWrong) {
            wrongQText += `\u3010${exam.name}\u3011\n${examWrong}`;
            hasWrongQ = true;
        }
    });
    if (hasWrongQ) {
        prompt += wrongQText;
        prompt += '\uFF08\u5B66\u751F\u5DF2\u4E0A\u4F20\u9519\u9898\u56FE\u7247\uFF0C\u8BF7\u6839\u636E\u9519\u9898\u6570\u91CF\u548C\u79D1\u76EE\u5206\u5E03\u63A8\u6D4B\u8584\u5F31\u70B9\uFF09\n';
    }

    prompt += '\n\u8981\u6C42\uFF1A\n';
    prompt += '1. \u8BF4\u8BDD\u8981\u7CBE\u7B80\u3001\u76F4\u63A5\u3001\u4E0D\u5E9F\u8BDD\uFF0C\u4E0D\u8981\u5BA2\u5957\u548C\u9F13\u821E\n';
    prompt += '2. \u9510\u8BC4\u98CE\u683C\uFF1A\u76F4\u8A00\u4E0D\u8BB3\u6307\u51FA\u95EE\u9898\uFF0C\u4E0D\u8981\u6E29\u67D4\u5B89\u6170\n';
    prompt += '3. \u6BCF\u79D1\u7528\u4E00\u53E5\u8BDD\u70B9\u8BC4\u8D8B\u52BF\uFF0C\u4E00\u9488\u89C1\u8840\n';
    prompt += '4. \u5982\u679C\u6709\u9519\u9898\u6570\u636E\uFF0C\u7ED3\u5408\u9519\u9898\u6307\u51FA\u77E5\u8BC6\u8584\u5F31\u70B9\n';
    prompt += '5. \u6700\u540E\u7ED9 3 \u6761\u6700\u5173\u952E\u7684\u6539\u8FDB\u5EFA\u8BAE\uFF0C\u6BCF\u6761\u4E0D\u8D85\u8FC7 20 \u5B57\n';
    prompt += '6. \u603B\u5B57\u6570\u63A7\u5236\u5728 300 \u5B57\u4EE5\u5185';

    try {
        const response = await fetch('/api/ai', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                model: 'qwen-plus',
                messages: [
                    { role: 'system', content: '\u4F60\u662F\u4E00\u4F4D\u4E25\u683C\u4F46\u8D1F\u8D23\u7684\u201C\u6BD2\u820C\u201D\u6559\u5E08\uFF0C\u8BF4\u8BDD\u7CBE\u7B80\u76F4\u63A5\uFF0C\u4E00\u9488\u89C1\u8840\u3002\u4E0D\u5BA2\u5957\u3001\u4E0D\u9F13\u821E\u3001\u4E0D\u5E9F\u8BDD\u3002\u6307\u51FA\u95EE\u9898\u8981\u72E0\uFF0C\u7ED9\u5EFA\u8BAE\u8981\u51C6\u3002' },
                    { role: 'user', content: prompt }
                ],
                temperature: 0.7,
                max_tokens: 3000
            })
        });

        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const aiText = data.choices[0].message.content;

        content.className = 'ai-content';
        content.textContent = aiText;

        // \u66F4\u65B0 API \u72B6\u6001
        document.getElementById('apiStatus').textContent = '\u2713 \u8FDE\u63A5\u6210\u529F';
        document.getElementById('apiStatus').className = 'status ok';

    } catch (err) {
        content.className = 'ai-content';
        content.innerHTML = '<span class="error">\u274C AI \u8C03\u7528\u5931\u8D25\uFF1A' + err.message + '</span>';
        document.getElementById('apiStatus').textContent = '\u2717 \u8C03\u7528\u5931\u8D25';
        document.getElementById('apiStatus').className = 'status err';
    } finally {
        btn.disabled = false;
        btn.textContent = '\u{1F916} AI \u9510\u8BC4';
    }
}

// \u4FDD\u5B58\u6570\u636E\u5230\u6D4F\u89C8\u5668\u672C\u673A
function saveLocalData() {
    try {
        const payload = examData.map(exam => ({
            name: exam.name,
            subjects: exam.subjects.map(sub => ({
                label: sub.label,
                score: sub.score,
                wrongImages: sub.wrongImages || []
            }))
        }));
        localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(payload));
    } catch (err) {
        console.log('\u672C\u673A\u6570\u636E\u4FDD\u5B58\u5931\u8D25', err);
    }
}

function restoreLocalData() {
    try {
        const localData = JSON.parse(localStorage.getItem(LOCAL_DATA_KEY) || 'null');
        if (Array.isArray(localData) && localData.length > 0) {
            examData = ensureDefaultSubjects(localData);
            saveLocalData();
            renderExamList();
            const status = document.getElementById('saveStatus');
            status.textContent = '\u2713 \u5DF2\u52A0\u8F7D\u672C\u673A\u5907\u4EFD';
            status.style.color = '#faad14';
        }
    } catch (err) {
        console.log('\u672C\u673A\u5907\u4EFD\u8BFB\u53D6\u5931\u8D25', err);
    }
}

async function saveData() {
    const btn = document.getElementById('btnSave');
    const status = document.getElementById('saveStatus');
    btn.disabled = true;
    btn.textContent = '\u23F3 \u4FDD\u5B58\u4E2D...';
    status.textContent = '';

    const payload = examData.map(exam => ({
        name: exam.name,
        subjects: exam.subjects.map(sub => ({
            label: sub.label,
            score: sub.score,
            wrongImages: sub.wrongImages || []
        }))
    }));
    saveLocalData();

    try {
        const res = await fetch('/api/exams', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        status.textContent = '\u2713 \u5DF2\u4FDD\u5B58 ' + new Date().toLocaleTimeString();
        status.style.color = '#52c41a';
    } catch (err) {
        status.textContent = '\u2717 \u4FDD\u5B58\u5931\u8D25\uFF1A' + err.message;
        status.style.color = '#ff4d4f';
    } finally {
        btn.disabled = false;
        btn.textContent = '\u{1F4BE} \u4FDD\u5B58\u6570\u636E';
    }
}

// \u4ECE\u670D\u52A1\u5668\u52A0\u8F7D\u6570\u636E
async function loadData() {
    const status = document.getElementById('saveStatus');
    try {
        const res = await fetch('/api/exams');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.length > 0) {
            examData = ensureDefaultSubjects(data.map(exam => ({
                name: exam.name,
                subjects: exam.subjects.map(sub => ({
                    label: sub.label,
                    score: sub.score || '',
                    wrongImages: sub.wrongImages || []
                }))
            })));
            saveLocalData();
            renderExamList();
            status.textContent = '\u2713 \u5DF2\u52A0\u8F7D\u5386\u53F2\u6570\u636E';
            status.style.color = '#52c41a';
        }
    } catch (err) {
        console.log('\u52A0\u8F7D\u6570\u636E\u5931\u8D25\uFF0C\u4F7F\u7528\u9ED8\u8BA4\u6570\u636E', err);
    }
}

// \u542F\u52A8\u65F6\u4ECE\u670D\u52A1\u5668\u52A0\u8F7D
restoreLocalData();
loadData();
</script>
